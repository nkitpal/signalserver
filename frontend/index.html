<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signal Server GUI</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='5' fill='%23ffcc33'/><circle cx='16' cy='16' r='10' fill='none' stroke='%234da3ff' stroke-width='2.5'/><circle cx='16' cy='16' r='14.5' fill='none' stroke='%234da3ff' stroke-width='1.5' opacity='.6'/></svg>" />
  </head>
  <body>
    <div id="app">
      <aside id="panel" aria-label="Plot management">
        <div class="brand">
          <span class="logo" aria-hidden="true"></span>
          <div>
            <h1>Signal Server</h1>
            <p>RF coverage planner</p>
          </div>
          <button id="toggle-panel" class="icon" title="Collapse panel" aria-label="Collapse panel">⟨</button>
        </div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="explorer">Explorer</button>
          <button role="tab" data-tab="analyze">Analyze</button>
          <button role="tab" data-tab="data">Data</button>
        </nav>
        <div id="panel-body"></div>
      </aside>
      <main id="map">
        <div id="globe"></div>
        <div class="toolbar">
          <form id="goto" role="search">
            <input name="q" type="search" placeholder="Go to lat, lon or name…" aria-label="Go to location" />
          </form>
          <label class="ctl">Map
            <select id="imagery" aria-label="Base map"></select>
          </label>
          <div class="ctl tools" role="toolbar" aria-label="Measure">
            <button data-tool="distance" aria-pressed="false" title="Measure distance">📏 Distance</button>
            <button data-tool="area" aria-pressed="false" title="Measure area">⬠ Area</button>
            <button data-tool="profile" aria-pressed="false" title="Terrain profile between two points">⛰ Profile</button>
          </div>
          <label class="ctl">Relief
            <input id="exaggeration" type="range" min="1" max="4" step="0.5" value="1" aria-label="Terrain exaggeration" />
            <span id="exaggeration-value">1×</span>
          </label>
        </div>
        <div id="legend" class="legend" hidden></div>
        <div id="inspector" class="inspector" hidden aria-live="off"></div>
        <section id="measure" class="measure" hidden aria-label="Measurement"><div id="measure-body"></div></section>
        <div id="coords" class="coords" aria-live="off"></div>
        <dialog id="dialog"></dialog>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
