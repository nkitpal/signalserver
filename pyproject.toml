[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signalserver-gui"
version = "2.0.0"
description = "Web app for Signal-Server RF coverage planning with automatic elevation data and a 3D globe viewer"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pillow>=10.3",
    "rasterio>=1.3.10",
    "shapely>=2.0",
    "simplekml>=1.3.6",
    "httpx>=0.27",
    "pmtiles>=3.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
signalserver-gui = "signalserver_gui.cli:main"

[tool.setuptools.packages.find]
include = ["signalserver_gui*"]

[tool.setuptools.package-data]
"signalserver_gui" = [
    "resources/*.json",
    "resources/antennas/*/*",
    "resources/color_profiles/*",
    "migrations/*.ini",
    "migrations/*.mako",
    "migrations/versions/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
